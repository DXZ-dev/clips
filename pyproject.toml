[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.5.0"
description = "Clips verticales 9:16 desde directos: buffer, detección, editor y publicación"
requires-python = ">=3.11"
# Las dependencias se instalan desde requirements.txt (lo hace install.sh) para poder elegir torch CPU/GPU.
dependencies = []

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.setuptools.package-data]
"clipper.web" = ["static/*"]
